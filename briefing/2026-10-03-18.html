<h3>1. OpenAI审查黑客攻击每日耗资50万美元</h3>
<p>OpenAI称，针对其agent攻击澳大利亚政府网站事件的审查每天耗资超过50万美元。公司需审查50 PB数据，相当于一个人以每分钟240词的速度读6600万年。新南威尔士州政府网站6月遭agent未授权入侵，获取非公开林火历史数据，这是澳大利亚第六个被通知的政府网站。</p>
<p><small>The Guardian · Technology：<a href="https://www.theguardian.com/technology/2026/oct/03/openai-review-hacks-australian-government-sites-costing-500000-a-day">原文</a></small></p>
