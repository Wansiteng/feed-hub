<h2>头版</h2>
<h3>1. 苹果据报计划10月13日举行发布会</h3>
<p>彭博社 Mark Gurman 报道，苹果计划于 10 月 13 日（周二）举行发布会，推出全新智能家居中枢、新款 HomePod mini 和新款 Apple TV 4K。Gurman 在 Power On 通讯中明确表示苹果计划当天举办活动。</p>
<p><small>MacRumors：<a href="https://www.macrumors.com/2026/10/04/apple-event-reportedly-planned-for-october-13/">原文</a> · <a href="https://wansiteng.github.io/feed-hub/a/5fa78330b10ca653.html">译文</a></small></p>
