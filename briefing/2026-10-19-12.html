<h3>1. 苹果筹备机械臂版 HomeView，iPhone Duo 溢价回落</h3>
<p>苹果正开发代号 J595 的机械臂智能家居屏幕，配约 9 英寸屏、可 360 度旋转并自动转向说话者，定位高于现款 HomeView，计划 2027 或 2028 年推出。iPhone Duo 将于 10 月 23 日发售，黑色 512GB 版本二级市场溢价从 6469 元回落至 3150 元，跌幅超五成。</p>
