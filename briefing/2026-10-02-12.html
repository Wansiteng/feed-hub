<h3>1. 美加州男子被控走私3亿美元英伟达AI芯片至中国</h3>
<p>美国联邦检察官逮捕加州男子Greg Lui，其经营的Earthmade Computer Inc.被控在2023至2024年间，与同伙未经许可向中国买家运送装有受限英伟达AI芯片的服务器，涉案金额达3亿美元，违反美国出口管制。</p>
