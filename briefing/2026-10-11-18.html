<h3>1. 苹果入门级 MacBook Pro 将提前采用新设计</h3>
<p>苹果计划在 2027 年上半年推出代号 K104 的入门级 MacBook Pro，搭载 M7 芯片并采用与高端机型一致的新设计。高端 MacBook 预计今年底至明年初率先改款，可能命名为 MacBook Ultra，入门级机型约半年后跟进，间隔远短于以往。新设计将支持触屏。</p>
