<h2>头版</h2>
<h3>1. OpenAI 预计年底年化营收达 700 亿美元</h3>
<p>OpenAI 预计到今年年底年化营收将达到或超过 700 亿美元，主要受企业业务增长推动。知情人士称，截至 9 月底，其年化营收约为 500 亿美元。该数字基于较短周期推算全年销售额。</p>
