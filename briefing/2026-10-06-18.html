<h2>头版</h2>
<h3>1. 索尼音乐要求下架超26万首AI深度伪造歌曲</h3>
<p>索尼音乐已要求各数字平台下架超过26万首AI深度伪造歌曲，接近其3月披露的13.5万首下架请求的两倍。索尼音乐表示，这些歌曲未经许可模仿旗下艺人的声音和形象，损害艺人利益、误导歌迷并破坏AI的伦理使用，每条欺诈性播放都在夺走艺人和词曲作者的收入。索尼音乐称此类内容正大规模出现，将联合行业伙伴检测和阻止，并敦促平台迅速行动。</p>
<p><small>Billboard：<a href="https://www.billboard.com/pro/sony-music-requested-removal-ai-deepfake-songs/">原文</a></small></p>
